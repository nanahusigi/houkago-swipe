<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="しゅんき・げんた・おぐら・おざわの4人ホームゲーム用、掛け金精算ツール(複数セット+未記録分の手動入力対応)">
<title>ポーカー精算</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  h1, h2, h3, p, ul, ol { margin: 0; }
  button { font: inherit; color: inherit; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --paper: #F2F6EF;
    --surface: #FFFFFF;
    --border: #D9E1D4;
    --border-strong: #C2CDBC;
    --ink: #16231D;
    --ink-soft: #57685D;
    --ink-faint: #8B9A8F;

    --felt: #0E3B2E;
    --felt-soft: #144A3A;
    --on-felt: #F1EDDF;
    --on-felt-soft: #B9CBBE;

    --gold: #9C7318;
    --gold-strong: #7C5B12;
    --gold-bg: #F4E8C8;

    --win: #1C5FA8;
    --win-bg: #E4EEF9;
    --lose: #A6332B;
    --lose-bg: #FAE7E4;

    --shadow: 0 1px 2px rgba(14, 59, 46, 0.08), 0 8px 24px rgba(14, 59, 46, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1A15;
      --surface: #142720;
      --border: #24392F;
      --border-strong: #34503F;
      --ink: #EBF2EC;
      --ink-soft: #A7B9AC;
      --ink-faint: #728278;

      --felt: #0A2A21;
      --felt-soft: #123B2E;
      --on-felt: #F1EDDF;
      --on-felt-soft: #A9C2B0;

      --gold: #D9AE4E;
      --gold-strong: #EAC776;
      --gold-bg: #2E2711;

      --win: #6FA8E0;
      --win-bg: #17293B;
      --lose: #E38A80;
      --lose-bg: #3A1F1C;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --paper: #0E1A15;
    --surface: #142720;
    --border: #24392F;
    --border-strong: #34503F;
    --ink: #EBF2EC;
    --ink-soft: #A7B9AC;
    --ink-faint: #728278;

    --felt: #0A2A21;
    --felt-soft: #123B2E;
    --on-felt: #F1EDDF;
    --on-felt-soft: #A9C2B0;

    --gold: #D9AE4E;
    --gold-strong: #EAC776;
    --gold-bg: #2E2711;

    --win: #6FA8E0;
    --win-bg: #17293B;
    --lose: #E38A80;
    --lose-bg: #3A1F1C;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'Space Mono', 'SF Mono', 'Consolas', monospace;
    font-variant-numeric: tabular-nums;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 48px;
  }

  /* ---------- header / felt band ---------- */

  .felt-band {
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, var(--felt-soft), var(--felt));
    color: var(--on-felt);
    padding: 26px 24px 26px;
    border-radius: 0 0 22px 22px;
    box-shadow: var(--shadow);
  }

  .felt-band::before {
    content: "♠";
    position: absolute;
    right: -18px;
    top: -34px;
    font-size: 150px;
    color: rgba(241, 237, 223, 0.05);
    line-height: 1;
    pointer-events: none;
  }

  .felt-band::after {
    content: "♣";
    position: absolute;
    left: -20px;
    bottom: -42px;
    font-size: 120px;
    color: rgba(241, 237, 223, 0.045);
    line-height: 1;
    pointer-events: none;
  }

  .felt-inner { position: relative; z-index: 1; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--on-felt-soft);
    font-weight: 500;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .eyebrow .suits { letter-spacing: 0.2em; color: var(--gold); opacity: 0.8; }

  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 2px;
  }

  .chip-mark {
    flex: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }

  .title {
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .title-sub {
    font-size: 12.5px;
    color: var(--on-felt-soft);
    margin: 0 0 22px;
  }

  .multiplier-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }

  .mult-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .chip-btn {
    appearance: none;
    cursor: pointer;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    position: relative;
    border: 3px solid rgba(241, 237, 223, 0.22);
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,0.10), transparent 55%),
      rgba(241, 237, 223, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
  }

  .chip-btn::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1.5px dashed rgba(241, 237, 223, 0.32);
  }

  .chip-btn:hover { background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.14), transparent 55%), rgba(241, 237, 223, 0.11); }
  .chip-btn:active { transform: translateY(1px) scale(0.97); }

  .chip-btn:focus-visible {
    outline: 2px solid var(--gold-strong);
    outline-offset: 2px;
  }

  .chip-btn .chip-face {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--on-felt);
    position: relative;
    z-index: 1;
  }

  .chip-yen {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--on-felt-soft);
    font-variant-numeric: tabular-nums;
  }

  .chip-btn.active {
    background: var(--gold);
    border-color: var(--gold);
  }
  .chip-btn.active::before { border-color: rgba(14, 59, 46, 0.35); }
  .chip-btn.active .chip-face { color: var(--felt); }
  .mult-col.active .chip-yen { color: var(--gold); font-weight: 700; }

  .buyin-line {
    margin-top: 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1px solid rgba(241, 237, 223, 0.16);
    padding-top: 14px;
  }

  .buyin-label { font-size: 12.5px; color: var(--on-felt-soft); }

  .buyin-value-wrap { text-align: right; }

  .buyin-value {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .buyin-value .unit { font-size: 13px; font-weight: 400; color: var(--on-felt-soft); margin-left: 2px; }

  .buyin-note {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--on-felt-soft);
    margin-top: 1px;
  }

  /* ---------- section labels ---------- */

  .section { padding: 22px 20px 0; }

  .section-title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .rule { flex: 1; height: 1px; background: var(--border-strong); }

  .section-hint {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin: 0 0 12px;
  }

  /* ---------- player cards ---------- */

  .players-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 460px) {
    .players-grid { grid-template-columns: 1fr; }
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 13px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .player-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .player-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
  }

  .card-index {
    flex: none;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    line-height: 1;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 3px 6px 4px;
    color: var(--ink-soft);
  }

  .card-index.red { color: var(--gold-strong); border-color: var(--gold-bg); }

  .final-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 6px 10px;
  }

  .final-field label {
    font-size: 11.5px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .final-field .yen-sign {
    font-family: 'Space Mono', monospace;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .final-field input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .final-field input:focus { outline: none; }
  .final-field:focus-within { border-color: var(--gold); }

  .live-yen {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
    min-height: 14px;
  }

  .net-pill {
    align-self: flex-start;
    border-radius: 999px;
    padding: 4px 11px;
    font-family: 'Space Mono', monospace;
    font-size: 13.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .net-pill.win { background: var(--win-bg); color: var(--win); }
  .net-pill.lose { background: var(--lose-bg); color: var(--lose); }
  .net-pill.even { background: var(--border); color: var(--ink-soft); }

  /* ---------- current-round footer / next-round ---------- */

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .check-line {
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .check-line.ok { color: var(--ink-soft); }
  .check-line.warn { color: var(--lose); }

  .check-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  .reset-btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .reset-btn:hover { border-color: var(--gold); color: var(--gold-strong); }
  .reset-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .next-round-btn {
    appearance: none;
    width: 100%;
    margin-top: 14px;
    border: none;
    background: var(--gold);
    color: var(--felt);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    padding: 12px 16px;
    border-radius: 11px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: filter 0.15s, transform 0.1s;
  }

  .next-round-btn:hover { filter: brightness(1.06); }
  .next-round-btn:active { transform: translateY(1px); }
  .next-round-btn:focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 2px; }

  /* ---------- round history ---------- */

  .round-list { display: flex; flex-direction: column; gap: 10px; }

  .round-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px 11px;
    box-shadow: var(--shadow);
  }

  .round-head { display: flex; align-items: center; gap: 8px; }

  .round-label {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
  }

  .round-mult {
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 1px 6px;
  }

  .round-del {
    margin-left: auto;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 4px 7px;
    border-radius: 6px;
    transition: background-color 0.15s, color 0.15s;
  }

  .round-del:hover { color: var(--lose); background: var(--lose-bg); }
  .round-del:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  .round-nets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    margin-top: 7px;
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
  }

  .round-nets span.win { color: var(--win); }
  .round-nets span.lose { color: var(--lose); }
  .round-nets span.even { color: var(--ink-faint); }

  .round-warn {
    margin-top: 6px;
    font-size: 11px;
    color: var(--lose);
  }

  /* ---------- manual (untracked) entries ---------- */

  .manual-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .manual-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
  }

  .manual-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }

  .manual-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sign-toggle {
    appearance: none;
    flex: none;
    cursor: pointer;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s, color 0.15s, transform 0.1s;
  }

  .sign-toggle:active { transform: scale(0.94); }
  .sign-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sign-toggle.pos { background: var(--win-bg); color: var(--win); }
  .sign-toggle.neg { background: var(--lose-bg); color: var(--lose); }

  .manual-field {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 5px 10px;
  }

  .manual-field .yen-sign {
    font-family: 'Space Mono', monospace;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .manual-field input {
    width: 84px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .manual-field input:focus { outline: none; }
  .manual-field:focus-within { border-color: var(--gold); }

  /* ---------- total ---------- */

  .total-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .total-row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    box-shadow: var(--shadow);
  }

  .total-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }

  /* ---------- settlement ticket ---------- */

  .ticket {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 18px 16px;
    box-shadow: var(--shadow);
  }

  .ticket::before {
    content: "";
    position: absolute;
    top: 0;
    left: 18px;
    right: 18px;
    height: 1px;
    background-image: radial-gradient(circle, var(--border-strong) 1.1px, transparent 1.2px);
    background-size: 9px 1px;
    background-repeat: repeat-x;
    background-position: top;
  }

  .transfer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .transfer-row:last-child { border-bottom: none; }

  .transfer-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }

  .transfer-name.from { color: var(--lose); }
  .transfer-name.to { color: var(--win); }

  .transfer-arrow { color: var(--gold); font-size: 15px; }

  .transfer-amount {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
  }

  .no-transfer {
    color: var(--ink-faint);
    font-size: 13.5px;
    text-align: center;
    padding: 6px 0;
  }

  .foot-note {
    padding: 22px 20px 0;
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
  }

  .reset-all-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 4px;
  }

  .reset-all-btn:hover { color: var(--lose); }

  [hidden] { display: none !important; }
</style>

<div class="page">
  <div class="felt-band">
    <div class="felt-inner">
      <p class="eyebrow">HOME GAME 4人卓 <span class="suits">♠ ♥ ♦ ♣</span></p>
      <div class="title-row">
        <svg class="chip-mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <circle cx="15" cy="15" r="13" fill="none" stroke="#F1EDDF" stroke-opacity="0.28" stroke-width="2.5"/>
          <circle cx="15" cy="15" r="13" fill="none" stroke="#D9AE4E" stroke-opacity="0.9" stroke-width="2.5" stroke-dasharray="3 4.2"/>
          <circle cx="15" cy="15" r="7.5" fill="#D9AE4E" fill-opacity="0.9"/>
          <text x="15" y="19" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" font-weight="700" fill="#0E3B2E">♠</text>
        </svg>
        <h1 class="title">ポーカー精算</h1>
      </div>
      <p class="title-sub">しゅんき・げんた・おぐら・おざわ</p>

      <div class="multiplier-row" id="multRow"></div>

      <div class="buyin-line">
        <span class="buyin-label">1人あたりの元本</span>
        <span class="buyin-value-wrap">
          <span class="buyin-value mono" id="buyinValue">¥225<span class="unit">/人</span></span>
          <span class="buyin-note" id="buyinNote"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">今セットの最終持ち点<span class="rule"></span></p>
    <p class="section-hint">「最終」は×1のときの点数で入力。倍率をかけた実際の金額は自動で計算されます。</p>
    <div class="players-grid" id="playersGrid"></div>

    <div class="footer-row">
      <span class="check-line" id="checkLine"></span>
      <button class="reset-btn" id="resetCurrentBtn" type="button">このセットを225にリセット</button>
    </div>

    <button class="next-round-btn" id="nextRoundBtn" type="button">このセットを保存して次のセットへ →</button>
  </div>

  <div class="section" id="roundHistorySection" hidden>
    <p class="section-title">セット履歴<span class="rule"></span></p>
    <div class="round-list" id="roundList"></div>
  </div>

  <div class="section">
    <p class="section-title">未記録分(このアプリを使う前)<span class="rule"></span></p>
    <p class="section-hint">記録せずに何セットかプレイした分は、最終的なプラマイ(円)をここに入力してください。左の＋／－ボタンで勝ち負けを切り替えてから金額を入力。総合精算に足されます。</p>
    <div class="manual-grid" id="manualGrid"></div>
  </div>

  <div class="section">
    <p class="section-title">総合精算<span class="rule"></span></p>
    <p class="section-hint" id="roundCountNote">1セット分の合計</p>

    <div class="total-grid" id="totalGrid"></div>

    <div class="ticket">
      <div id="totalTransferList"></div>
      <div class="footer-row">
        <span class="check-line" id="totalCheckLine"></span>
        <button class="reset-all-btn" id="resetAllBtn" type="button">全セットを消去</button>
      </div>
    </div>
  </div>

  <p class="foot-note">1セット終えるごとに「次のセットへ」で保存すると、総合精算にまとまります</p>
</div>

<script>
(function () {
  var PLAYER_INFO = [
    { name: 'しゅんき', rank: 'A', suit: '♠' },
    { name: 'げんた', rank: 'K', suit: '♥' },
    { name: 'おぐら', rank: 'Q', suit: '♦' },
    { name: 'おざわ', rank: 'J', suit: '♣' }
  ];
  var PLAYERS = PLAYER_INFO.map(function (p) { return p.name; });
  var RED_SUITS = { '♥': true, '♦': true };
  var BASE = 225;
  var MULTIPLIERS = [1, 2, 3, 4, 5];
  var STORAGE_KEY = 'poker-seisan-state-v2';

  function defaultRound(mult) {
    var finals = {};
    PLAYERS.forEach(function (p) { finals[p] = BASE; });
    return { multiplier: MULTIPLIERS.indexOf(mult) >= 0 ? mult : 1, finals: finals };
  }

  function sanitizeRound(r) {
    var mult = MULTIPLIERS.indexOf(r && r.multiplier) >= 0 ? r.multiplier : 1;
    var finals = {};
    PLAYERS.forEach(function (p) {
      var v = r && r.finals ? r.finals[p] : undefined;
      finals[p] = (typeof v === 'number' && !isNaN(v)) ? v : BASE;
    });
    return { multiplier: mult, finals: finals };
  }

  function sanitizeManual(m) {
    var out = {};
    PLAYERS.forEach(function (p) {
      var v = m ? m[p] : undefined;
      out[p] = (typeof v === 'number' && !isNaN(v)) ? v : 0;
    });
    return out;
  }

  function loadState() {
    var fallback = { rounds: [], current: defaultRound(1), manual: sanitizeManual(null) };
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return fallback;
      var rounds = Array.isArray(parsed.rounds) ? parsed.rounds.map(sanitizeRound) : [];
      var current = sanitizeRound(parsed.current);
      var manual = sanitizeManual(parsed.manual);
      return { rounds: rounds, current: current, manual: manual };
    } catch (e) {
      return fallback;
    }
  }

  var state = loadState();

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode etc. */ }
  }

  function actualBuyIn(mult) { return BASE * mult; }
  function netOf(round, name) { return (round.finals[name] - BASE) * round.multiplier; }
  function baseSum(round) { return PLAYERS.reduce(function (s, p) { return s + round.finals[p]; }, 0); }
  function pillClass(n) { return n > 0 ? 'win' : n < 0 ? 'lose' : 'even'; }

  function fmtYen(n) {
    var sign = n < 0 ? '-' : '';
    return sign + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
  }

  function fmtSigned(n) {
    var r = Math.round(n);
    if (r > 0) return '+¥' + r.toLocaleString('ja-JP');
    if (r < 0) return '-¥' + Math.abs(r).toLocaleString('ja-JP');
    return '¥0';
  }

  function computeSettlement(nets) {
    var creditors = nets.filter(function (n) { return n.amount > 0.5; })
      .map(function (n) { return { name: n.name, amount: n.amount }; })
      .sort(function (a, b) { return b.amount - a.amount; });
    var debtors = nets.filter(function (n) { return n.amount < -0.5; })
      .map(function (n) { return { name: n.name, amount: -n.amount }; })
      .sort(function (a, b) { return b.amount - a.amount; });

    var result = [];
    var i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      var pay = Math.min(debtors[i].amount, creditors[j].amount);
      if (pay > 0.5) result.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(pay) });
      debtors[i].amount -= pay;
      creditors[j].amount -= pay;
      if (debtors[i].amount <= 0.5) i++;
      if (creditors[j].amount <= 0.5) j++;
    }
    return result;
  }

  /* ---------- current round: multiplier chips ---------- */

  function renderMultRow() {
    var row = document.getElementById('multRow');
    row.innerHTML = '';
    MULTIPLIERS.forEach(function (m) {
      var active = state.current.multiplier === m;
      var col = document.createElement('div');
      col.className = 'mult-col' + (active ? ' active' : '');

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip-btn' + (active ? ' active' : '');
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.setAttribute('aria-label', '掛け金 ×' + m);
      btn.innerHTML = '<span class="chip-face">×' + m + '</span>';
      btn.addEventListener('click', function () { onMultiplierChange(m); });

      var yen = document.createElement('span');
      yen.className = 'chip-yen';
      yen.textContent = '¥' + actualBuyIn(m).toLocaleString('ja-JP');

      col.appendChild(btn);
      col.appendChild(yen);
      row.appendChild(col);
    });
  }

  function onMultiplierChange(m) {
    if (state.current.multiplier === m) return;
    state.current.multiplier = m;
    saveState();
    renderMultRow();
    updateBuyin();
    PLAYERS.forEach(updateCardDynamic);
    updateCurrentCheck();
    updateTotals();
  }

  function updateBuyin() {
    var mult = state.current.multiplier;
    document.getElementById('buyinValue').innerHTML = fmtYen(actualBuyIn(mult)) + '<span class="unit">/人</span>';
    document.getElementById('buyinNote').textContent = mult > 1 ? ('¥' + BASE.toLocaleString('ja-JP') + ' × ' + mult) : '';
  }

  /* ---------- current round: player cards (built once, updated in place) ---------- */

  function buildPlayerCards() {
    var grid = document.getElementById('playersGrid');
    grid.innerHTML = '';
    PLAYER_INFO.forEach(function (info) {
      var name = info.name;
      var indexClass = RED_SUITS[info.suit] ? 'card-index red' : 'card-index';

      var card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML =
        '<div class="player-head">' +
          '<div class="player-name">' + name + '</div>' +
          '<div class="' + indexClass + '">' + info.rank + info.suit + '</div>' +
        '</div>' +
        '<div class="final-field">' +
          '<label for="final-' + name + '">最終(×1)</label>' +
          '<span class="yen-sign">¥</span>' +
          '<input id="final-' + name + '" type="number" inputmode="numeric" step="1" value="' + state.current.finals[name] + '">' +
        '</div>' +
        '<div class="live-yen" id="live-' + name + '"></div>' +
        '<div class="net-pill" id="netpill-' + name + '"></div>';

      var input = card.querySelector('input');
      // Only ever mutate state + this player's own small spans on input —
      // never rebuild the grid here, or the input loses focus and the
      // on-screen keyboard closes after every digit.
      input.addEventListener('input', function () {
        var v = parseInt(input.value, 10);
        state.current.finals[name] = isNaN(v) ? 0 : v;
        saveState();
        updateCardDynamic(name);
        updateCurrentCheck();
        updateTotals();
      });

      grid.appendChild(card);
    });
  }

  function updateCardDynamic(name) {
    var mult = state.current.multiplier;
    var baseVal = state.current.finals[name];
    var actual = baseVal * mult;

    var live = document.getElementById('live-' + name);
    live.textContent = mult > 1
      ? ('¥' + baseVal.toLocaleString('ja-JP') + ' × ' + mult + ' = ' + fmtYen(actual))
      : '';

    var net = (baseVal - BASE) * mult;
    var pill = document.getElementById('netpill-' + name);
    pill.className = 'net-pill ' + pillClass(net);
    pill.textContent = fmtSigned(net);
  }

  function updateCurrentCheck() {
    var diffBase = baseSum(state.current) - BASE * PLAYERS.length;
    var el = document.getElementById('checkLine');
    if (diffBase === 0) {
      el.className = 'check-line ok';
      el.innerHTML = '<span class="check-dot"></span>このセットの合計が場の金額と一致';
    } else {
      el.className = 'check-line warn';
      el.innerHTML = '<span class="check-dot"></span>このセットの合計が ' + fmtYen(Math.abs(diffBase) * state.current.multiplier) + ' 合いません';
    }
  }

  /* ---------- round history ---------- */

  function renderRoundHistory() {
    var section = document.getElementById('roundHistorySection');
    var list = document.getElementById('roundList');
    if (state.rounds.length === 0) {
      section.hidden = true;
      list.innerHTML = '';
      return;
    }
    section.hidden = false;
    list.innerHTML = '';

    state.rounds.forEach(function (round, idx) {
      var mismatch = baseSum(round) !== BASE * PLAYERS.length;
      var netsHtml = PLAYER_INFO.map(function (info) {
        var n = netOf(round, info.name);
        return '<span class="' + pillClass(n) + '">' + info.name + ' ' + fmtSigned(n) + '</span>';
      }).join('');

      var row = document.createElement('div');
      row.className = 'round-row';
      row.innerHTML =
        '<div class="round-head">' +
          '<span class="round-label">セット' + (idx + 1) + '</span>' +
          '<span class="round-mult">×' + round.multiplier + '</span>' +
          '<button class="round-del" type="button" data-idx="' + idx + '" aria-label="セット' + (idx + 1) + 'を削除">✕</button>' +
        '</div>' +
        '<div class="round-nets">' + netsHtml + '</div>' +
        (mismatch ? '<div class="round-warn">⚠ 合計が場の金額と合っていません</div>' : '');

      row.querySelector('.round-del').addEventListener('click', function () {
        state.rounds.splice(idx, 1);
        saveState();
        renderRoundHistory();
        updateTotals();
      });

      list.appendChild(row);
    });
  }

  /* ---------- manual (untracked) entries ---------- */

  // Mobile numeric keypads (inputmode="numeric") usually have no "-" key,
  // so sign is a separate ± toggle button and the number field only ever
  // holds a non-negative magnitude.
  var manualSign = {};

  function buildManualRows() {
    var grid = document.getElementById('manualGrid');
    grid.innerHTML = '';
    PLAYER_INFO.forEach(function (info) {
      var name = info.name;
      manualSign[name] = state.manual[name] < 0 ? -1 : 1;
      var magnitude = Math.abs(state.manual[name]);

      var row = document.createElement('div');
      row.className = 'manual-row';
      row.innerHTML =
        '<span class="manual-name">' + name + '</span>' +
        '<div class="manual-controls">' +
          '<button type="button" class="sign-toggle ' + (manualSign[name] > 0 ? 'pos' : 'neg') + '" id="sign-' + name + '" aria-label="' + name + 'の勝ち負けを切り替え">' + (manualSign[name] > 0 ? '+' : '−') + '</button>' +
          '<div class="manual-field">' +
            '<span class="yen-sign">¥</span>' +
            '<input id="manual-' + name + '" type="number" inputmode="numeric" step="1" min="0" value="' + magnitude + '">' +
          '</div>' +
        '</div>';

      var input = row.querySelector('input');
      var toggleBtn = row.querySelector('.sign-toggle');

      function applyValue() {
        var v = parseInt(input.value, 10);
        var mag = isNaN(v) ? 0 : Math.abs(v);
        state.manual[name] = mag * manualSign[name];
        saveState();
        updateTotals();
      }

      // Same rule as the round inputs: never rebuild this grid from an
      // input handler, or focus (and the mobile keyboard) drops.
      input.addEventListener('input', applyValue);

      toggleBtn.addEventListener('click', function () {
        manualSign[name] *= -1;
        toggleBtn.className = 'sign-toggle ' + (manualSign[name] > 0 ? 'pos' : 'neg');
        toggleBtn.textContent = manualSign[name] > 0 ? '+' : '−';
        applyValue();
      });

      grid.appendChild(row);
    });
  }

  /* ---------- grand total ---------- */

  function updateTotals() {
    var allRounds = state.rounds.concat([state.current]);
    var totals = PLAYERS.map(function (name) {
      var sum = 0;
      allRounds.forEach(function (r) { sum += netOf(r, name); });
      sum += state.manual[name];
      return { name: name, amount: sum };
    });

    var totalGrid = document.getElementById('totalGrid');
    totalGrid.innerHTML = '';
    totals.forEach(function (t) {
      var row = document.createElement('div');
      row.className = 'total-row-item';
      row.innerHTML =
        '<span class="total-name">' + t.name + '</span>' +
        '<span class="net-pill ' + pillClass(t.amount) + '">' + fmtSigned(t.amount) + '</span>';
      totalGrid.appendChild(row);
    });

    var transfers = computeSettlement(totals);
    var settleWrap = document.getElementById('totalTransferList');
    settleWrap.innerHTML = '';
    if (transfers.length === 0) {
      settleWrap.innerHTML = '<div class="no-transfer">精算の必要はありません</div>';
    } else {
      transfers.forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'transfer-row';
        row.innerHTML =
          '<span class="transfer-name from">' + t.from + '</span>' +
          '<span class="transfer-arrow">→</span>' +
          '<span class="transfer-name to">' + t.to + '</span>' +
          '<span class="transfer-amount mono">' + fmtYen(t.amount) + '</span>';
        settleWrap.appendChild(row);
      });
    }

    var hasManual = PLAYERS.some(function (p) { return state.manual[p] !== 0; });
    var totalSum = totals.reduce(function (s, t) { return s + t.amount; }, 0);
    var checkEl = document.getElementById('totalCheckLine');
    if (Math.round(totalSum) === 0) {
      checkEl.className = 'check-line ok';
      checkEl.innerHTML = '<span class="check-dot"></span>全' + allRounds.length + 'セット' + (hasManual ? ' + 未記録分' : '') + 'の合計が一致';
    } else {
      checkEl.className = 'check-line warn';
      checkEl.innerHTML = '<span class="check-dot"></span>合計が ' + fmtYen(Math.abs(totalSum)) + ' 合いません(セット履歴・未記録分を確認)';
    }

    document.getElementById('roundCountNote').textContent =
      allRounds.length + 'セット分' + (hasManual ? ' + 未記録分' : '') + 'の合計';
  }

  /* ---------- buttons ---------- */

  document.getElementById('resetCurrentBtn').addEventListener('click', function () {
    PLAYERS.forEach(function (p) { state.current.finals[p] = BASE; });
    saveState();
    PLAYERS.forEach(function (name) {
      document.getElementById('final-' + name).value = BASE;
      updateCardDynamic(name);
    });
    updateCurrentCheck();
    updateTotals();
  });

  document.getElementById('nextRoundBtn').addEventListener('click', function () {
    state.rounds.push(sanitizeRound(state.current));
    state.current = defaultRound(state.current.multiplier);
    saveState();

    buildPlayerCards();
    renderMultRow();
    updateBuyin();
    PLAYERS.forEach(updateCardDynamic);
    updateCurrentCheck();
    renderRoundHistory();
    updateTotals();
  });

  document.getElementById('resetAllBtn').addEventListener('click', function () {
    if (!confirm('全セット・未記録分の記録を消去します。よろしいですか？')) return;
    state = { rounds: [], current: defaultRound(1), manual: sanitizeManual(null) };
    saveState();

    renderMultRow();
    buildPlayerCards();
    updateBuyin();
    PLAYERS.forEach(updateCardDynamic);
    updateCurrentCheck();
    renderRoundHistory();
    buildManualRows();
    updateTotals();
  });

  /* ---------- init ---------- */

  renderMultRow();
  buildPlayerCards();
  updateBuyin();
  PLAYERS.forEach(updateCardDynamic);
  updateCurrentCheck();
  renderRoundHistory();
  buildManualRows();
  updateTotals();
})();
</script>
</body>
</html>
